<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b7f000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Coach Player</title>
<style>
:root{--lime:#b7f000;--yellow:#ffd600;--orange:#ff6a00;--bg:#030405;--card:#0b0d0f;--line:#25282b}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{background:radial-gradient(circle at 50% 0,#15191b 0,#050607 38%,#000 100%)}
.app{max-width:1180px;margin:auto;min-height:100vh;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #202326;padding-bottom:14px}
.brand{font-size:clamp(30px,5vw,66px);font-weight:1000;letter-spacing:.02em}.brand span{color:var(--lime)}
.badge{border:1px solid #394000;color:var(--lime);padding:9px 12px;border-radius:999px;font-weight:900}
.home{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:20px}
.panel{background:linear-gradient(180deg,#111416,#090b0c);border:1px solid #24282b;border-radius:20px;padding:20px;box-shadow:0 18px 50px #0008}
h2{margin:0 0 12px;color:var(--lime)}
textarea{width:100%;height:180px;background:#050607;color:#fff;border:2px solid #333;border-radius:14px;padding:14px;font-size:16px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{background:#090b0c;color:#fff;border:2px solid #444;border-radius:12px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer}
button.primary{background:var(--lime);color:#090b0c;border-color:var(--lime)}
button.secondary{border-color:var(--yellow);color:var(--yellow)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{min-height:84px}
.info{color:#b9bec2;line-height:1.5}.small{font-size:13px;color:#7f868b}
#player{display:none;margin-top:18px}
.playerGrid{display:grid;grid-template-columns:1fr .78fr 1fr;gap:16px;align-items:center}
.card{background:#030405;border-radius:18px;padding:12px;min-height:490px;display:flex;flex-direction:column}
.cur{border:3px solid var(--yellow)}
.next{border:3px solid var(--lime)}
.label{text-align:center;font-weight:900;font-size:22px;padding:7px}
.cur .label{color:var(--yellow)}
.next .label{color:var(--lime)}
.visual{flex:1;display:flex;align-items:center;justify-content:center;font-size:80px;background:#07090a;border-radius:12px}
.name{text-align:center;font-weight:900;font-size:22px;padding:12px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid currentColor;padding-top:9px;gap:5px}
.meta div{text-align:center;font-size:12px}
.meta b{display:block;margin-bottom:5px}
.cur .meta{color:var(--yellow)}
.next .meta{color:var(--lime)}
.meta span{color:#fff}
.mid{display:flex;flex-direction:column;align-items:center}
.ring{width:min(31vw,350px);aspect-ratio:1;border:8px solid var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#030405}
#status{font-size:28px;font-weight:900;color:var(--yellow)}
#timer{font-size:70px;font-weight:1000}
.round{font-weight:900;color:var(--yellow);margin-top:15px}
body.rest .ring{border-color:var(--orange)}
body.rest #status,body.rest .round{color:var(--orange)}
.playerControls{display:flex;justify-content:center;gap:10px;margin-top:18px}
@media(max-width:800px){
.home{grid-template-columns:1fr}
.playerGrid{grid-template-columns:1fr}
.card{min-height:320px}
.ring{width:260px}
#timer{font-size:58px}
}
